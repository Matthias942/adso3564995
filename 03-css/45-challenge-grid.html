<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        div.gallery {
            display: grid;
            grid-template-areas:    " one two three "
                                    " four two five "
                                    " six six seven ";
            grid-template-rows: 200px 150px 250px;  
            grid-gap: 0.2rem;
            width: 100%;
            justify-content: center;
            
            img {
                border: 1px solid white;
                width: 100%;
                height: 100%;
                background-color: #f00;
    
                &:first-child {
                    background-color: #00f;
                    grid-area: one;
                }
                &:nth-child(2) {
                    grid-area: two;
                }
                &:nth-child(3) {
                    grid-area: three;
                }
                &:nth-child(4) {
                    background-color: #00f;
                    grid-area: four;
                }
                &:nth-child(5) {
                    grid-area: five;
                }
                &:nth-child(6) {
                    grid-area: six;
                }
                &:last-child {
                    grid-area: seven;
                }
            }
        }



        div.gallery2 {
            height: 400px;
            display: grid;
            grid-template-areas:    " one one two three  "
                                    " one one four four  "
                                    " five six four four ";
            grid-auto-rows: 120px ;
            grid-template-columns: 85px 85px 85px 85px;  
            grid-gap: 0.2rem;
            justify-content: center;
            
            img {
                border: 1px solid white;
                width: 100%;
                height: 100%;
                background-color: #f00;
    
                &:first-child {
                    background-color: #00f;
                    grid-area: one;
                }
                &:nth-child(2) {
                    grid-area: two;
                }
                &:nth-child(3) {
                    grid-area: three;
                }
                &:nth-child(4) {
                    background-color: #00f;
                    grid-area: four;
                }
                &:nth-child(5) {
                    grid-area: five;
                }
                &:last-child {
                    grid-area: six;
                }
            }
        }
    </style>
</head>
<body class="css"> 
    <nav class="goback">

        </a>
        
    </nav>
<main>
    <header class="mmenu internal">
        <h1>45-challenge-grid</h1>
        <img src="../src/images/logo-css.png" alt="CSS">
        <h3>Irregular Gallery.</h3>
    </header>
    <section>
        <h3 class="subtitle"> Gallery 1: </h3>
        <div class="gallery">
            <img src="imgs/descarga1.png" alt="MotoGP" class="one">
            <img src="imgs/descarga2.jpg" alt="MotoGP" class="two">
            <img src="imgs/descarga3.png" alt="MotoGP" class="three">
            <img src="imgs/descarga4.jpg" alt="MotoGP" class="four">
            <img src="imgs/descarga5.jpg" alt="MotoGP" class="five">
            <img src="imgs/descarga6.jpg" alt="MotoGP" class="six">
            <img src="imgs/descarga7.png" alt="MotoGP" class="seven">
        </div>

        <h3 class="subtitle"> Gallery 2: </h3>
        <div class="gallery2">
            <img src="imgs/car1.jpg" alt="Carro" class="1">
            <img src="imgs/car2.png" alt="Carro" class="2">
            <img src="imgs/car3.jpg" alt="Carro" class="3">
            <img src="imgs/car4.png" alt="Carro" class="4">
            <img src="imgs/car5.png" alt="Carro" class="5">
            <img src="imgs/car6.jpg" alt="Carro" class="6">
